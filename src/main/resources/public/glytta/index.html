<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>glytta</title>
<meta name="description" content="glytta: a component-based Java web framework. A brand concept.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Sora:wght@300..800&family=IBM+Plex+Sans:wght@400;600&family=IBM+Plex+Mono:wght@400&display=swap">
<style>
:root {
	--abyss: #0b1a2e;
	--deep: #14385a;
	--sea-glass: #9fdbe9;
	--foam: #e9f8fa;
	--mist: #b9d3dc;
	--jelly: #f08bb4;
}

* { box-sizing: border-box; }

html, body { margin: 0; height: 100%; }

body {
	background: var(--abyss);
	color: var(--foam);
	font-family: "IBM Plex Sans", system-ui, sans-serif;
}

.hero {
	position: relative;
	min-height: 100vh;
	min-height: 100svh;
	overflow: hidden;
	display: grid;
	place-items: center;
	padding: 4rem 1.5rem;
}

.hero-inner {
	position: relative;
	z-index: 1;
	display: flex;
	align-items: center;
	gap: clamp(2rem, 5vw, 4.5rem);
	max-width: 1200px;
}

.hero-jelly {
	flex: none;
	width: clamp(220px, 34vw, 420px);
	height: auto;
	overflow: visible;
}

.hero-text {
	display: flex;
	flex-direction: column;
	gap: 1.1rem;
}

.wordmark {
	margin: 0;
	font-family: "Sora", sans-serif;
	font-size: clamp(76px, 13vw, 168px);
	font-weight: 650;
	line-height: .9;
	letter-spacing: -.04em;
	color: var(--foam);
}

.tagline {
	margin: 0;
	max-width: 30ch;
	text-wrap: balance;
	font-size: clamp(19px, 2.2vw, 26px);
	line-height: 1.35;
	color: var(--mist);
}

.domains {
	margin: 0;
	font-family: "IBM Plex Mono", ui-monospace, monospace;
	font-size: 16px;
	color: var(--sea-glass);
}

@media (max-width: 760px) {
	.hero-inner { flex-direction: column; text-align: center; }
	.hero-text { align-items: center; }
}

/* The jellyfish: the bell pulses, the tentacles trail behind it, the whole animal bobs */

.jelly-body { animation: bob 7s ease-in-out infinite; }

.jelly-bell {
	transform-box: fill-box;
	transform-origin: 50% 0;
	animation: pulse 3.2s ease-in-out infinite;
}

.jelly-trail {
	transform-box: fill-box;
	transform-origin: 50% 0;
	animation: trail 3.2s ease-in-out infinite;
}

.jelly-glow { animation: glow 3.2s ease-in-out infinite; }

.jelly-sparkle { animation: twinkle 4s ease-in-out infinite; }
.jelly-sparkle:nth-child(2) { animation-delay: -1.2s; }
.jelly-sparkle:nth-child(3) { animation-delay: -2.1s; }
.jelly-sparkle:nth-child(4) { animation-delay: -3s; }
.jelly-sparkle:nth-child(5) { animation-delay: -.6s; }

@keyframes pulse {
	0%, 100% { transform: scale(1, 1); }
	40% { transform: scale(1.06, .9); }
}

@keyframes trail {
	0%, 100% { transform: scaleY(1) skewX(0deg); }
	40% { transform: scaleY(.95) skewX(2deg); }
	70% { transform: scaleY(1.04) skewX(-3deg); }
}

@keyframes bob {
	0%, 100% { transform: translateY(0); }
	50% { transform: translateY(-3px); }
}

@keyframes glow {
	0%, 100% { opacity: .9; }
	40% { opacity: 1; }
	70% { opacity: .7; }
}

@keyframes twinkle {
	0%, 100% { opacity: .2; }
	50% { opacity: 1; }
}

/* Smaller jellies drifting up through the background */

.drift {
	position: absolute;
	bottom: -20vh;
	left: var(--x);
	width: var(--size);
	opacity: var(--opacity);
	animation: rise var(--duration) linear infinite;
	animation-delay: var(--delay);
	pointer-events: none;
}

.drift svg {
	display: block;
	width: 100%;
	height: auto;
	animation: drift-pulse 3.6s ease-in-out infinite;
	transform-origin: 50% 20%;
}

@keyframes rise {
	from { transform: translate(0, 0) rotate(var(--tilt)); }
	50% { transform: translate(3vw, -70vh) rotate(calc(var(--tilt) * -1)); }
	to { transform: translate(0, -140vh) rotate(var(--tilt)); }
}

@keyframes drift-pulse {
	0%, 100% { transform: scale(1, 1); }
	40% { transform: scale(1.05, .92); }
}

@media (prefers-reduced-motion: reduce) {
	.jelly-body, .jelly-bell, .jelly-trail, .jelly-glow, .jelly-sparkle, .drift, .drift svg { animation: none; }
	.drift { display: none; }
}
</style>
</head>
<body>

<svg width="0" height="0" style="position: absolute" aria-hidden="true">
	<defs>
		<symbol id="jelly" viewBox="0 0 64 64">
			<g fill="none" stroke="#5fb8d0" stroke-width="1.3" stroke-linecap="round">
				<path d="M15 32 C14 40 18 46 15 54" />

				<path d="M42 33.5 C43 42 40 49 42 58" />
				<path d="M49 32 C50 40 46 46 49 54" />
			</g>
			<g fill="none" stroke="#f08bb4" stroke-width="2.6" stroke-linecap="round" stroke-opacity=".85">
				<path d="M29 34 C26 40 32 44 28 50 C26 53 28 56 27 59" />
				<path d="M35 34 C38 40 32 45 36 51 C38 54 36 57 37 60" />
			</g>
			<path d="M12 30 C12 16 21 8 32 8 C43 8 52 16 52 30 C50 32.5 47.5 31 46 32.5 C43.5 34.5 41 32.5 39 33.5 C36.5 35 34 33.5 32 34.5 C30 33.5 27.5 35 25 33.5 C23 32.5 20.5 34.5 18 32.5 C16.5 31 14 32.5 12 30 Z" fill="#9fdbe9" fill-opacity=".85" stroke="#3b8fb3" />
			<path d="M17 27 C17 18 24 12.5 32 12.5 C40 12.5 47 18 47 27 C40 25 24 25 17 27 Z" fill="#e9f8fa" fill-opacity=".6" />
			<ellipse cx="26" cy="22" rx="3.6" ry="2.8" fill="none" stroke="#f08bb4" stroke-width="2" />
			<ellipse cx="38" cy="22" rx="3.6" ry="2.8" fill="none" stroke="#f08bb4" stroke-width="2" />
		</symbol>
	</defs>
</svg>

<main class="hero">
	<div class="drift" style="--x: 8%; --size: 64px; --opacity: .3; --duration: 46s; --delay: -8s; --tilt: -10deg"><svg aria-hidden="true"><use href="#jelly" /></svg></div>
	<div class="drift" style="--x: 38%; --size: 80px; --opacity: .4; --duration: 38s; --delay: -24s; --tilt: 8deg"><svg aria-hidden="true"><use href="#jelly" /></svg></div>
	<div class="drift" style="--x: 64%; --size: 44px; --opacity: .25; --duration: 52s; --delay: -36s; --tilt: -6deg"><svg aria-hidden="true"><use href="#jelly" /></svg></div>
	<div class="drift" style="--x: 86%; --size: 56px; --opacity: .3; --duration: 42s; --delay: -14s; --tilt: 12deg"><svg aria-hidden="true"><use href="#jelly" /></svg></div>
	<div class="drift" style="--x: 22%; --size: 36px; --opacity: .2; --duration: 58s; --delay: -44s; --tilt: 5deg"><svg aria-hidden="true"><use href="#jelly" /></svg></div>

	<div class="hero-inner">
		<svg class="hero-jelly" viewBox="0 0 64 64" role="img" aria-label="A glowing jellyfish">
			<g class="jelly-glow">
				<circle cx="32" cy="26" r="25" fill="#9fdbe9" fill-opacity=".2" />
				<circle cx="32" cy="24" r="18" fill="#9fdbe9" fill-opacity=".18" />
			</g>
			<g fill="#7fd0e0">
				<circle class="jelly-sparkle" cx="7" cy="14" r="1.2" />
				<circle class="jelly-sparkle" cx="57" cy="11" r="1" />
				<circle class="jelly-sparkle" cx="59" cy="40" r="1.3" />
				<circle class="jelly-sparkle" cx="5" cy="44" r="1" />
				<circle class="jelly-sparkle" cx="52" cy="58" r=".9" />
			</g>
			<g class="jelly-body">
				<g class="jelly-trail">
					<g fill="none" stroke="#5fb8d0" stroke-width="1.3" stroke-linecap="round">
						<path d="M15 32 C14 40 18 46 15 54" />
						<path d="M22 33.5 C21 42 24 49 22 58" />
						<path d="M42 33.5 C43 42 40 49 42 58" />
						<path d="M49 32 C50 40 46 46 49 54" />
					</g>
					<g fill="none" stroke="#f08bb4" stroke-width="2.6" stroke-linecap="round" stroke-opacity=".85">
						<path d="M29 34 C26 40 32 44 28 50 C26 53 28 56 27 59" />
						<path d="M35 34 C38 40 32 45 36 51 C38 54 36 57 37 60" />
					</g>
				</g>
				<g class="jelly-bell">
					<path d="M12 30 C12 16 21 8 32 8 C43 8 52 16 52 30 C50 32.5 47.5 31 46 32.5 C43.5 34.5 41 32.5 39 33.5 C36.5 35 34 33.5 32 34.5 C30 33.5 27.5 35 25 33.5 C23 32.5 20.5 34.5 18 32.5 C16.5 31 14 32.5 12 30 Z" fill="#b8ecf3" fill-opacity=".9" stroke="#3b8fb3" />
					<path d="M17 27 C17 18 24 12.5 32 12.5 C40 12.5 47 18 47 27 C40 25 24 25 17 27 Z" fill="#ffffff" fill-opacity=".7" />
					<ellipse cx="26" cy="22" rx="3.6" ry="2.8" fill="none" stroke="#f08bb4" stroke-width="2" />
					<ellipse cx="38" cy="22" rx="3.6" ry="2.8" fill="none" stroke="#f08bb4" stroke-width="2" />
				</g>
			</g>
		</svg>

		<div class="hero-text">
			<h1 class="wordmark">glytta</h1>
			<p class="tagline">A component-based Java web framework.</p>
			<p class="domains">glytta.com · marglytta.com</p>
		</div>
	</div>
</main>

</body>
</html>
