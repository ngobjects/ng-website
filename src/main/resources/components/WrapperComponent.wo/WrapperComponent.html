<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8">
		<meta name="viewport" content="width=device-width, initial-scale=1">
		<meta name="color-scheme" content="light dark">
		<title><wo:str value="$meta.title" /></title>
		<wo:element elementName="meta" name="description" content="$meta.description" />
		<wo:if condition="$robotsContent"><wo:element elementName="meta" name="robots" content="$robotsContent" /></wo:if>
		<wo:element elementName="link" rel="canonical" href="$canonicalURL" />
		<meta property="og:site_name" content="engifer" />
		<meta property="og:locale" content="en_US" />
		<wo:element elementName="meta" property="og:type" content="$meta.type" />
		<wo:element elementName="meta" property="og:title" content="$meta.title" />
		<wo:element elementName="meta" property="og:description" content="$meta.description" />
		<wo:element elementName="meta" property="og:url" content="$canonicalURL" />
		<wo:element elementName="meta" property="og:image" content="$shareImageURL" />
		<meta property="og:image:width" content="1200" />
		<meta property="og:image:height" content="630" />
		<meta property="og:image:alt" content="engifer: a Java web framework" />
		<meta name="twitter:card" content="summary_large_image" />
		<wo:if condition="$structuredData"><script type="application/ld+json"><wo:str value="$structuredData" escapeHTML="$false" /></script></wo:if>
		<link rel="icon" href="/favicon.ico" sizes="16x16 32x32 48x48" />
		<link rel="icon" type="image/svg+xml" href="/engifer.svg" />
		<link rel="apple-touch-icon" href="/apple-touch-icon.png" />
		<link rel="manifest" href="/site.webmanifest" />
		<meta name="theme-color" content="#f5f8f6" media="(prefers-color-scheme: light)" />
		<meta name="theme-color" content="#0e1513" media="(prefers-color-scheme: dark)" />
		<wo:stylesheet filename="prism.css" />
		<wo:stylesheet filename="main.css" />
	</head>
	<body>
		<div class="shell">
			<aside class="sidebar">
				<a href="/" class="brand">
					<picture>
						<source srcset="/engifer-logo-on-dark.svg" media="(prefers-color-scheme: dark)" />
						<img src="/engifer-logo.svg" alt="engifer" width="132" height="36" />
					</picture>
					<span class="badge">alpha</span>
				</a>
				<nav class="tree" id="contents" aria-label="Contents">
					<wo:repetition list="$sections" item="$currentSection">
						<h2><wo:str value="$currentSection.title" /></h2>
						<ul>
							<wo:repetition list="$currentSection.nodes" item="$currentNode">
								<li>
									<wo:if condition="$currentNode.isLink">
										<wo:link href="$currentNode.url" aria-current="$nodeAriaCurrent"><wo:str value="$currentNode.name" /></wo:link>
									</wo:if>
									<wo:if condition="$currentNode.isLink" negate="$true">
										<span class="group"><wo:str value="$currentNode.name" /></span>
									</wo:if>
									<wo:if condition="$currentNode.hasChildren">
										<ul>
											<wo:repetition list="$currentNode.children" item="$currentChild">
												<li><wo:link href="$currentChild.url" aria-current="$childAriaCurrent"><wo:str value="$currentChild.name" /></wo:link></li>
											</wo:repetition>
										</ul>
									</wo:if>
								</li>
							</wo:repetition>
						</ul>
					</wo:repetition>
				</nav>
				<div class="powered-slot">
					<a href="https://www.engifer.com/" class="powered" title="Powered by engifer, an homage to the 88×31 badges of the WebObjects era">
						<img src="/engifer.svg" alt="" width="20" height="20" />
						<span class="powered-text"><span class="k">Powered by</span><span class="v">e<span class="ng">ng</span>ifer</span></span>
					</a>
				</div>
			</aside>
			<div class="main">
				<header class="topbar">
					<ol class="breadcrumbs" aria-label="You are here">
						<wo:repetition list="$breadcrumbs" item="$currentCrumb">
							<li><wo:str value="$currentCrumb" /></li>
						</wo:repetition>
					</ol>
					<nav class="topbar-links" aria-label="Site">
						<a href="#contents" class="contents-link">Contents</a>
						<a href="https://github.com/ngobjects/ng-objects">GitHub</a>
						<form class="search" action="/search" role="search">
							<input type="search" name="searchString" placeholder="Search" aria-label="Search the site" />
						</form>
					</nav>
				</header>
				<main class="content prose">
					<wo:content />
				</main>
				<footer class="site-footer">
					This site runs on engifer. <a href="https://github.com/ngobjects/ng-website">View its source on GitHub</a>.
				</footer>
			</div>
		</div>
		<wo:script filename="prism.js" />
	</body>
</html>
