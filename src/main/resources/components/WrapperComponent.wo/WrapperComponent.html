<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8">
		<meta name="viewport" content="width=device-width, initial-scale=1">
		<meta name="color-scheme" content="light dark">
		<title><wo:str value="$meta.title" /></title>
		<wo:element elementName="meta" name="description" content="$meta.description" />
		<wo:if condition="$robotsContent"><wo:element elementName="meta" name="robots" content="$robotsContent" /></wo:if>
		<wo:element elementName="link" rel="canonical" href="$canonicalURL" />
		<wo:element elementName="meta" property="og:site_name" content="$theme.name" />
		<meta property="og:locale" content="en_US" />
		<wo:element elementName="meta" property="og:type" content="$meta.type" />
		<wo:element elementName="meta" property="og:title" content="$meta.title" />
		<wo:element elementName="meta" property="og:description" content="$meta.description" />
		<wo:element elementName="meta" property="og:url" content="$canonicalURL" />
		<wo:element elementName="meta" property="og:image" content="$shareImageURL" />
		<meta property="og:image:width" content="1200" />
		<meta property="og:image:height" content="630" />
		<meta property="og:image:alt" content="glytta: a Java web framework" />
		<meta name="twitter:card" content="summary_large_image" />
		<wo:if condition="$structuredData"><script type="application/ld+json"><wo:str value="$structuredData" escapeHTML="$false" /></script></wo:if>
		<link rel="icon" href="/favicon.ico" sizes="16x16 32x32 48x48" />
		<wo:if condition="$theme.isGlytta"><link rel="icon" type="image/svg+xml" href="<wo:resourceURL filename="glytta.svg" />" /></wo:if>
		<wo:if condition="$theme.isEngifer"><link rel="icon" type="image/svg+xml" href="<wo:resourceURL filename="engifer.svg" />" /></wo:if>
		<link rel="apple-touch-icon" href="/apple-touch-icon.png" />
		<link rel="manifest" href="/site.webmanifest" />
		<wo:if condition="$theme.isGlytta">
			<meta name="theme-color" content="#eef7f9" media="(prefers-color-scheme: light)" />
			<meta name="theme-color" content="#08131f" media="(prefers-color-scheme: dark)" />
			<link rel="preconnect" href="https://fonts.googleapis.com" />
			<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
			<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Sora:wght@500..700&amp;family=IBM+Plex+Sans:ital,wght@0,400;0,500;0,600;1,400&amp;family=IBM+Plex+Mono:wght@400;500;700&amp;display=swap" />
		</wo:if>
		<wo:if condition="$theme.isEngifer">
			<meta name="theme-color" content="#f5f8f6" media="(prefers-color-scheme: light)" />
			<meta name="theme-color" content="#0e1513" media="(prefers-color-scheme: dark)" />
		</wo:if>
		<wo:stylesheet filename="prism.css" />
		<wo:stylesheet filename="main.css" />
		<wo:if condition="$theme.isEngifer"><wo:stylesheet filename="engifer.css" /></wo:if>
		
		<!-- Plausible (stats.rebbi.is), proxied through our own domain by ng-plausible; renders nothing in development -->
		<wo:NGPlausibleScript />
	</head>
	<body>
		<div class="shell">
			<aside class="sidebar">
				<a href="/" class="brand">
					<wo:if condition="$theme.isGlytta">
						<wo:img filename="glytta.svg" alt="" width="36" height="36" />
						<span class="brand-word wordmark">gly<span class="kt1">t</span><span class="kt2">t</span><span class="ka">a</span></span>
					</wo:if>
					<wo:if condition="$theme.isEngifer">
						<picture>
							<source srcset="<wo:resourceURL filename="engifer-logo-on-dark.svg" />" media="(prefers-color-scheme: dark)" />
							<wo:img filename="engifer-logo.svg" alt="engifer" width="132" height="36" />
						</picture>
					</wo:if>
					<span class="badge">alpha</span>
				</a>
				<nav class="tree" id="contents" aria-label="Contents">
					<wo:repetition list="$sections" item="$currentSection">
						<h2><wo:str value="$currentSection.title" /></h2>
						<ul>
							<wo:repetition list="$currentSection.nodes" item="$currentNode">
								<li>
									<wo:if condition="$currentNode.isLink">
										<wo:link href="$currentNode.url" aria-current="$nodeAriaCurrent"><wo:str value="$currentNode.name" /></wo:link>
									</wo:if>
									<wo:if condition="$currentNode.isLink" negate="$true">
										<span class="group"><wo:str value="$currentNode.name" /></span>
									</wo:if>
									<wo:if condition="$currentNode.hasChildren">
										<ul>
											<wo:repetition list="$currentNode.children" item="$currentChild">
												<li><wo:link href="$currentChild.url" aria-current="$childAriaCurrent"><wo:str value="$currentChild.name" /></wo:link></li>
											</wo:repetition>
										</ul>
									</wo:if>
								</li>
							</wo:repetition>
						</ul>
					</wo:repetition>
				</nav>
				<div class="powered-slot">
					<a href="https://www.engifer.com/" class="powered" title="Powered by <wo:str value="$theme.name" />, an homage to the 88×31 badges of the WebObjects era">
						<wo:if condition="$theme.isGlytta">
							<wo:img filename="glytta.svg" alt="" width="20" height="20" />
							<span class="powered-text"><span class="k">Powered by</span><span class="v wordmark">gly<span class="kt1">t</span><span class="kt2">t</span><span class="ka">a</span></span></span>
						</wo:if>
						<wo:if condition="$theme.isEngifer">
							<wo:img filename="engifer.svg" alt="" width="20" height="20" />
							<span class="powered-text"><span class="k">Powered by</span><span class="v">e<span class="ng">ng</span>ifer</span></span>
						</wo:if>
					</a>
				</div>
			</aside>
			<div class="main">
				<header class="topbar">
					<ol class="breadcrumbs" aria-label="You are here">
						<wo:repetition list="$breadcrumbs" item="$currentCrumb">
							<li><wo:str value="$currentCrumb" /></li>
						</wo:repetition>
					</ol>
					<nav class="topbar-links" aria-label="Site">
						<a href="#contents" class="contents-link">Contents</a>
						<a href="https://github.com/ngobjects/ng-objects">GitHub</a>
						<form class="search" action="/search" role="search">
							<input type="search" name="searchString" placeholder="Search" aria-label="Search the site" />
						</form>
					</nav>
				</header>
				<main class="content prose">
					<wo:content />
				</main>
				<footer class="site-footer">
					<p>This site runs on <wo:str value="$theme.name" />. <a href="https://github.com/ngobjects/ng-website">View its source on GitHub</a>.</p>
					<p class="theme-switch">Look: <wo:if condition="$theme.isGlytta"><wo:link href="$engiferThemeURL">engifer</wo:link> · <strong>glytta</strong></wo:if><wo:if condition="$theme.isEngifer"><strong>engifer</strong> · <wo:link href="$glyttaThemeURL">glytta</wo:link></wo:if></p>
					<a class="maker" href="https://godurkodi.is/en/" hreflang="en">
						<span>Made by</span>
						<svg class="maker-mark" viewBox="-571.54 -324.06 1143.09 648.11" width="30" height="17" aria-hidden="true">
							<g class="maker-loop">
								<path d="M-133.64 -204.35 L-233.35 -304.06 A20 20 0 0 0 -261.63 -304.06 L-551.54 -14.14 A20 20 0 0 0 -551.54 14.14 L-261.63 304.06 A20 20 0 0 0 -233.35 304.06 L-9.90 80.61 L-80.61 9.90 L-247.49 176.78 L-424.26 0.00 L-247.49 -176.78 L-204.35 -133.64 Z"/>
								<path d="M-113.84 -43.13 L43.13 113.84 L113.84 43.13 L-43.13 -113.84 Z"/>
								<path d="M133.64 204.35 L233.35 304.06 A20 20 0 0 0 261.63 304.06 L551.54 14.14 A20 20 0 0 0 551.54 -14.14 L261.63 -304.06 A20 20 0 0 0 233.35 -304.06 L9.90 -80.61 L80.61 -9.90 L247.49 -176.78 L424.26 -0.00 L247.49 176.78 L204.35 133.64 Z"/>
							</g>
							<g fill="#d99a2b">
								<path d="M113.84 -204.35 L14.14 -304.06 A20 20 0 0 0 -14.14 -304.06 L-304.06 -14.14 A20 20 0 0 0 -304.06 14.14 L-204.35 113.84 L-133.64 43.13 L-176.78 0.00 L-0.00 -176.78 L43.13 -133.64 Z"/>
								<path d="M133.64 -43.13 L176.78 -0.00 L0.00 176.78 L-43.13 133.64 L-113.84 204.35 L-14.14 304.06 A20 20 0 0 0 14.14 304.06 L304.06 14.14 A20 20 0 0 0 304.06 -14.14 L204.35 -113.84 Z"/>
							</g>
						</svg>
						<strong>Góður kóði</strong>
					</a>
				</footer>
			</div>
		</div>
		<wo:script filename="prism.js" />
	</body>
</html>
