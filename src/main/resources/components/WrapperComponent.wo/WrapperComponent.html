<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8">
		<meta name="viewport" content="width=device-width, initial-scale=1">
		<meta name="color-scheme" content="light dark">
		<title>ng-objects</title>
		<link rel="icon" type="image/png" href="/shark.png" />
		<wo:stylesheet filename="prism.css" />
		<wo:stylesheet filename="main.css" />
	</head>
	<body>
		<div class="site">
			<header class="site-header">
				<a href="/" class="wordmark"><img src="/shark.png" alt="" width="28" height="28" />ng-objects</a>
				<nav class="site-nav" aria-label="Site">
					<a href="/page/getting-started">Documentation</a>
					<a href="https://github.com/ngobjects/ng-objects">GitHub</a>
					<form class="search" action="/search" role="search">
						<input type="search" name="searchString" placeholder="Search" aria-label="Search the documentation" />
					</form>
				</nav>
			</header>
			<wo:if condition="$hideSidebar">
				<main class="plain">
					<wo:content />
				</main>
			</wo:if>
			<wo:if condition="$hideSidebar" negate="$true">
				<div class="docs">
					<nav class="docs-nav" aria-label="Documentation">
						<ul>
							<wo:repetition list="$pages" item="$currentPage">
								<li><wo:link href="$currentPage.url" aria-current="$ariaCurrent"><wo:str value="$currentPage.name" /></wo:link></li>
							</wo:repetition>
						</ul>
					</nav>
					<main class="prose">
						<wo:content />
					</main>
				</div>
			</wo:if>
			<footer class="site-footer">
				This site runs on ng-objects. <a href="https://github.com/ngobjects/ng-website">View its source on GitHub</a>.
			</footer>
		</div>
		<wo:script filename="prism.js" />
	</body>
</html>
