<wo:WrapperComponent>
	<h1>Dynamic elements</h1>
	<p>Documentation for the standard dynamic elements that come with the framework.</p>

	<aside>
		<p>This page is generated from <a href="https://github.com/ngobjects/ng-objects/blob/master/ng-appserver/src/main/java/ng/appserver/elements/docs/NGDynamicElementDescription.java">NGDynamicElementDescription</a>.</p>
		<p><strong>Elements</strong></p>
		<ul>
			<wo:repetition list="$all" item="$current">
				<li><wo:link href="$currentAnchor"><wo:str value="$current.elementClass.getSimpleName" /></wo:link></li>
			</wo:repetition>
		</ul>
	</aside>

	<wo:repetition list="$all" item="$current">
		<section class="element-doc">
			<h3>
				<wo:repetition list="$current.aliases" item="$currentAlias">
					<wo:container elementName="a" id="$current.elementClass.simpleName"><wo:str value="$currentAlias" /></wo:container>
				</wo:repetition>
				<wo:if condition="$current.isContainerElement"><span class="badge">Container</span></wo:if>
			</h3>
			<div class="classname"><code><wo:str value="$current.elementClass.getName" /></code></div>
			<p><wo:str value="$current.text" /></p>
			<wo:if condition="$currentHasBindings">
				<h4>Bindings</h4>
				<ul class="bindings">
					<wo:repetition list="$current.bindings" item="$currentBinding">
						<li>
							<strong><wo:str value="$currentBinding.name" /></strong><br>
							<wo:str value="$currentBinding.text" />
						</li>
					</wo:repetition>
				</ul>
			</wo:if>
		</section>
	</wo:repetition>
</wo:WrapperComponent>
